services:
  # PostgreSQL Database for NocoDB
  nocodb-postgres:
    image: postgres:15-alpine
    container_name: nocodb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodb_secure_password_2024
    volumes:
      - nocodb-postgres-data:/var/lib/postgresql/data
    networks:
      - nocodb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb -d nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NocoDB Application
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    depends_on:
      nocodb-postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      NC_DB: "pg://nocodb-postgres:5432?u=nocodb&p=nocodb_secure_password_2024&d=nocodb"

      # Application Settings
      NC_AUTH_JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
      NC_PUBLIC_URL: "http://72.60.51.124:8081"

      # Optional: Redis for caching (uncomment if you want to add Redis)
      # NC_REDIS_URL: "redis://nocodb-redis:6379"

      # Optional: SMTP Configuration for email notifications
      # NC_SMTP_FROM: "noreply@yourdomain.com"
      # NC_SMTP_HOST: "smtp.gmail.com"
      # NC_SMTP_PORT: "587"
      # NC_SMTP_USERNAME: "your-email@gmail.com"
      # NC_SMTP_PASSWORD: "your-app-password"
      # NC_SMTP_SECURE: "true"

      # Storage Configuration (local storage)
      NC_ATTACHMENT_FIELD_SIZE: "20971520"  # 20MB max file size
      NC_MAX_ATTACHMENTS_ALLOWED: "10"

      # Disable telemetry (optional)
      NC_DISABLE_TELE: "true"

      # Enable public share
      NC_DISABLE_EMAIL_AUTH: "false"

      # Admin email (first user)
      NC_ADMIN_EMAIL: "admin@nocodb.com"
      NC_ADMIN_PASSWORD: "admin123"

    volumes:
      - nocodb-data:/usr/app/data
    ports:
      - "8081:8080"
    networks:
      - nocodb-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Redis for caching (uncomment to enable)
  # nocodb-redis:
  #   image: redis:7-alpine
  #   container_name: nocodb-redis
  #   restart: unless-stopped
  #   volumes:
  #     - nocodb-redis-data:/data
  #   networks:
  #     - nocodb-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  nocodb-network:
    driver: bridge

volumes:
  nocodb-postgres-data:
    driver: local
  nocodb-data:
    driver: local
  # nocodb-redis-data:
  #   driver: local
